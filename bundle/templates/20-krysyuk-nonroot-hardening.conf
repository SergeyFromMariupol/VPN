# Reviewed non-root 3X-UI hardening skeleton. Provisioning validates paths
# before installing this as an active systemd drop-in.
[Service]
User=xui
Group=xui
SupplementaryGroups=xui-secrets
UMask=0077
RuntimeDirectory=x-ui
RuntimeDirectoryMode=0750
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
NoNewPrivileges=yes
PrivateDevices=yes
PrivateTmp=yes
ProtectClock=yes
ProtectControlGroups=yes
ProtectHome=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectSystem=strict
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
ReadWritePaths=/etc/x-ui /usr/local/x-ui/bin /var/lib/x-ui /var/log/x-ui /run/x-ui
