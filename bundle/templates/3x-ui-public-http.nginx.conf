map $http_upgrade $krysyuk_panel_connection_upgrade {
    default upgrade;
    ''      close;
}

map $request_method $krysyuk_panel_write_key {
    default '';
    POST    $binary_remote_addr;
}

limit_req_zone $krysyuk_panel_write_key zone=krysyuk_panel_write:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=krysyuk_panel_connections:10m;

server {
    listen __SERVER_IPV4__:2053;
    server_name __PUBLIC_FQDN__;


    server_tokens off;
    client_max_body_size 32m;
    limit_req_status 429;
    limit_conn_status 429;

    access_log off;
    error_log /dev/null crit;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /__PANEL_BASE_PATH__/ {
        limit_conn krysyuk_panel_connections 20;
        limit_req zone=krysyuk_panel_write burst=20 nodelay;

        proxy_pass http://127.0.0.1:2053;
        proxy_http_version 1.1;
        proxy_set_header Host "__PUBLIC_FQDN__:2053";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host "__PUBLIC_FQDN__:2053";
        proxy_set_header X-Forwarded-Port 2053;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $krysyuk_panel_connection_upgrade;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_cookie_flags ~ nosecure httponly samesite=strict;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}
