
map $http_user_agent $vpn_sub_app_mode {
    default "";
    "~*^INCY/[^/]+/android(?:[[:space:]]|$)" bypass;
    "~*^Happ/[^/]+/Android(?:TV)?(?:/|$)" bypass;
}

map $vpn_sub_app_mode $vpn_sub_app_list {
    default "";
    bypass "__ANDROID_APP_LIST__";
}

map $http_user_agent $vpn_sub_app_enable {
    default "";
    "~*^INCY/[^/]+/android(?:[[:space:]]|$)" 1;
}

map $http_user_agent $vpn_sub_providerid {
    default "";
    "~*^Happ/[^/]+/Android(?:TV)?(?:/|$)" "__HAPP_PROVIDER_ID__";
}

map $http_user_agent $vpn_sub_routing {
    default $upstream_http_routing;
    "~*^INCY(?:/|$)" "__INCY_ROUTING__";
    ~*^v2RayTun "__V2RAYTUN_ROUTING__";
}

map $http_user_agent $vpn_sub_routing_enable {
    default $upstream_http_routing_enable;
    "~*^INCY(?:/|$)" true;
}

# Keep any website or announcement already set by the subscription owner.
map "$http_user_agent|$upstream_http_profile_web_page_url" $vpn_sub_website {
    default $upstream_http_profile_web_page_url;
    "~*^(?:Happ|INCY)/[^|]*[|]$" "__ANDROID_APP_LIST_URL__";
}

map "$http_user_agent|$upstream_http_announce|$upstream_http_announce_url" $vpn_sub_copy_announcement {
    default 0;
    "~*^v2RayTun[^|]*[|][|]$" 1;
}

map $vpn_sub_copy_announcement $vpn_sub_announce {
    default $upstream_http_announce;
    1 "__ANDROID_APP_LIST_ANNOUNCE__";
}

map $vpn_sub_copy_announcement $vpn_sub_announce_url {
    default $upstream_http_announce_url;
    1 "__ANDROID_APP_LIST_URL__";
}

# The HTML filter needs an uncompressed upstream page.
map "$http_accept|$arg_html|$arg_view" $vpn_sub_accept_encoding {
    default $http_accept_encoding;
    ~*text/html "";
    "~[|]1[|]" "";
    "~*[|]html$" "";
}

server {
    listen __SERVER_IPV4__:2096__SUB_TLS__;
    server_name __PUBLIC_FQDN__;
    __SUB_CERT__

    access_log off;
    error_log /dev/null crit;
    server_tokens off;

    location ^~ /__SUBSCRIPTION_PATH__/ {
        limit_except GET { deny all; }

        proxy_pass __SUB_SCHEME__://127.0.0.1:2096;
        proxy_http_version 1.1;
        proxy_set_header Host "__PUBLIC_FQDN__:2096";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "__PUBLIC_FQDN__:2096";
        proxy_set_header X-Forwarded-Port 2096;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Accept-Encoding $vpn_sub_accept_encoding;

        sub_filter '<div id="app"></div>' '<div id="app"></div><link rel="stylesheet" href="/android-app-bypass.css" referrerpolicy="no-referrer"><script src="/android-app-bypass.js" defer referrerpolicy="no-referrer"></script>';

        proxy_hide_header Routing;
        proxy_hide_header Routing-Enable;
        proxy_hide_header Profile-Web-Page-Url;
        proxy_hide_header Announce;
        proxy_hide_header Announce-Url;
        add_header Profile-Web-Page-Url $vpn_sub_website;
        add_header Announce $vpn_sub_announce;
        add_header Announce-Url $vpn_sub_announce_url;
        add_header Routing $vpn_sub_routing;
        add_header Routing-Enable $vpn_sub_routing_enable;
        add_header per-app-proxy-enable $vpn_sub_app_enable;
        add_header per-app-proxy-mode $vpn_sub_app_mode;
        add_header per-app-proxy-list $vpn_sub_app_list;
        add_header providerid $vpn_sub_providerid;
    }

    location = /android-app-bypass.css {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type text/css;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control no-store;
        return 200 __ANDROID_APPS_CSS__;
    }

    location = /android-app-bypass.js {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type 'application/javascript; charset=utf-8';
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control no-store;
        return 200 __ANDROID_APPS_JS__;
    }

    location / { return 404; }
}
