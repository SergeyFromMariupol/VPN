name: Validate installer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Python syntax and tests
        run: |
          python3 -m compileall -q tools bundle tests
          python3 -m unittest discover -s tests -v
          python3 bundle/tests/test-core.py
          python3 -m unittest discover -s bundle/base -p test_certbot_contract.py -v
      - name: Verify source manifest
        run: sha256sum --check --strict SHA256SUMS
      - name: WARP transaction and watchdog tests
        run: |
          bash bundle/warp-egress/tests/test-bootstrap-plan-safety.sh
          bash bundle/warp-egress/tests/test-health-watchdog-semantics.sh
          sudo bash bundle/warp-egress/tests/test-phase-checkpoints.sh
      - name: Prepare isolated UFW fixture tools
        timeout-minutes: 5
        run: |
          missing=0
          for command in ufw ip unshare mount shellcheck; do
            command -v "$command" >/dev/null || missing=1
          done
          if ((missing)); then
            sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --error-on=any update -qq
            sudo apt-get -o DPkg::Lock::Timeout=180 install -y --no-install-recommends ufw iproute2 util-linux shellcheck
          fi
      - name: Check actual UFW output in isolated namespaces
        timeout-minutes: 2
        run: |
          sudo env GITHUB_ACTIONS=true CI=true bash -x bundle/tests/test-ufw-contract.sh
      - name: ShellCheck WARP runtime scripts
        run: find bundle/warp-egress/scripts bundle/warp-egress/tests -type f -name '*.sh' -print0 | xargs -0 shellcheck --external-sources --severity=warning
      - name: Exercise crash recovery policy in disposable systemd unit
        run: sudo env GITHUB_ACTIONS=true CI=true bash bundle/tests/test-nginx-restart-policy.sh
      - name: Render and validate WARP static assets
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends jq nftables
          rendered="$RUNNER_TEMP/vpn-bundle-rendered"
          cp -a bundle "$rendered"
          TARGET_IPV4=198.51.100.42 TARGET_INTERFACE=ci0 python3 tools/render.py "$rendered"
          (cd "$rendered" && sha256sum --check --strict SOURCE_SHA256SUMS >/dev/null)
          ! getent passwd xraywarp
          ! getent group xraywarp
          [[ ! -e /bin/warp-svc && ! -e /opt/krysyuk-warp-egress && ! -e /usr/local/libexec/krysyuk-warp-egress ]]
          cleanup() {
            sudo rm -f -- /bin/warp-svc
            sudo rm -r -- /opt/krysyuk-warp-egress /usr/local/libexec/krysyuk-warp-egress 2>/dev/null || true
            sudo userdel xraywarp 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo useradd --system --user-group --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin xraywarp
          sudo install -d -m 0755 /opt/krysyuk-warp-egress/bin /usr/local/libexec/krysyuk-warp-egress
          sudo install -m 0755 /bin/true /bin/warp-svc
          sudo install -m 0755 /bin/true /opt/krysyuk-warp-egress/bin/xray
          sudo install -m 0755 "$rendered"/warp-egress/scripts/*.sh /usr/local/libexec/krysyuk-warp-egress/
          sudo bash "$rendered/warp-egress/tests/test-static-assets.sh"
      - name: Install and check pinned Certbot with IP support
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/vpn-certbot"
          "$RUNNER_TEMP/vpn-certbot/bin/python" -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r bundle/base/certbot-requirements.txt
          "$RUNNER_TEMP/vpn-certbot/bin/python" -m pip check
          "$RUNNER_TEMP/vpn-certbot/bin/python" -I bundle/base/verify-certbot.py bundle/base/certbot-requirements.txt "$RUNNER_TEMP/vpn-certbot"
          "$RUNNER_TEMP/vpn-certbot/bin/certbot" --version
          "$RUNNER_TEMP/vpn-certbot/bin/certbot" --help all > "$RUNNER_TEMP/certbot-help.txt"
          grep -F -- '--ip-address' "$RUNNER_TEMP/certbot-help.txt"
          grep -F -- '--required-profile' "$RUNNER_TEMP/certbot-help.txt"
