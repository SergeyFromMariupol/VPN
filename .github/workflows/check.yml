name: Validate installer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Python syntax and tests
        run: |
          python3 -m compileall -q tools bundle tests
          python3 -m unittest discover -s tests -v
          python3 bundle/tests/test-core.py
          python3 -m unittest discover -s bundle/base -p test_certbot_contract.py -v
      - name: Verify source manifest
        run: sha256sum --check --strict SHA256SUMS
      - name: WARP transaction and watchdog tests
        run: |
          bash bundle/warp-egress/tests/test-bootstrap-plan-safety.sh
          bash bundle/warp-egress/tests/test-health-watchdog-semantics.sh
          sudo bash bundle/warp-egress/tests/test-phase-checkpoints.sh
      - name: Check actual UFW output in isolated namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ufw iproute2 util-linux shellcheck
          sudo env GITHUB_ACTIONS=true CI=true bash bundle/tests/test-ufw-contract.sh
      - name: ShellCheck WARP runtime scripts
        run: find bundle/warp-egress/scripts bundle/warp-egress/tests -type f -name '*.sh' -print0 | xargs -0 shellcheck --external-sources --severity=warning
      - name: Install and check pinned Certbot with IP support
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/vpn-certbot"
          "$RUNNER_TEMP/vpn-certbot/bin/python" -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r bundle/base/certbot-requirements.txt
          "$RUNNER_TEMP/vpn-certbot/bin/python" -m pip check
          "$RUNNER_TEMP/vpn-certbot/bin/python" -I bundle/base/verify-certbot.py bundle/base/certbot-requirements.txt "$RUNNER_TEMP/vpn-certbot"
          "$RUNNER_TEMP/vpn-certbot/bin/certbot" --version
          "$RUNNER_TEMP/vpn-certbot/bin/certbot" --help all > "$RUNNER_TEMP/certbot-help.txt"
          grep -F -- '--ip-address' "$RUNNER_TEMP/certbot-help.txt"
          grep -F -- '--required-profile' "$RUNNER_TEMP/certbot-help.txt"
