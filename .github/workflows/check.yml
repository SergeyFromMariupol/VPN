name: Validate installer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Python syntax and tests
        run: |
          python3 -m compileall -q tools bundle tests
          python3 -m unittest discover -s tests -v
          python3 bundle/tests/test-core.py
      - name: Verify source manifest
        run: sha256sum --check --strict SHA256SUMS
      - name: WARP transaction and watchdog tests
        run: |
          bash bundle/warp-egress/tests/test-bootstrap-plan-safety.sh
          bash bundle/warp-egress/tests/test-health-watchdog-semantics.sh
          sudo bash bundle/warp-egress/tests/test-phase-checkpoints.sh
